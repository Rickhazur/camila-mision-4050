<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sleep Well, Live Better — Camila's Presentation</title>
<style>
  body{font-family:Georgia,serif;max-width:760px;margin:0 auto;padding:20px;background:#FFFDF5;color:#222;line-height:1.5}
  h1{font-size:28px;margin-bottom:2px}
  h2{font-size:22px;margin:28px 0 4px;border-bottom:2px solid #026A79;padding-bottom:4px}
  .sub{color:#555;margin-top:0}
  .badge{display:inline-block;background:#026A79;color:#fff;padding:4px 12px;border-radius:20px;font-size:14px}
  .timerbox{background:#123C46;color:#fff;border-radius:12px;padding:14px 18px;margin:18px 0}
  .timerbox .time{font-size:28px;font-weight:bold}
  .bar{height:10px;background:#ffffff33;border-radius:5px;margin-top:8px;overflow:hidden}
  .bar i{display:block;height:100%;background:#FFD94D;width:0%}
  .controls button,.part button{background:#026A79;color:#fff;border:none;padding:10px 16px;border-radius:8px;font-size:16px;cursor:pointer;margin:4px 6px 4px 0}
  .controls button.stop,.part button.stop{background:#8a8a8a}
  .part{border:1px solid #ddd;border-radius:12px;padding:16px 18px;margin:16px 0;background:#fff}
  .part.chorus{background:#FFF8DC;border-color:#D9A441}
  .part.active{box-shadow:0 0 0 3px #026A79}
  .part h3{margin:0 0 8px;font-size:18px}
  .en p{font-size:22px;margin:6px 0}
  .word{padding:1px 2px;border-radius:4px}
  .word.on{background:#FFE27A;box-shadow:0 0 0 2px #D9A441}
  .note{color:#555;font-size:14px}
</style>
</head>
<body>
<h1>🎵 Sleep Well, Live Better</h1>
<p class="sub">Camila's presentation — only what she says: objectives, presentation, conclusion.</p>
<p><span class="badge">⏱ About 3 minutes live, with pauses</span></p>

<div class="timerbox">
  <div class="time"><span id="elapsed">0:00</span> <span style="font-size:16px">/ audio model</span></div>
  <div class="bar"><i id="progress"></i></div>
  <p class="note" style="color:#cfe8ea">The audio model speaks at natural pace. Live, with pauses between parts, the presentation lasts about 3 minutes.</p>
</div>

<div class="controls">
  <button onclick="playAll()">▶ Play everything in order</button>
  <button class="stop" onclick="stopAll()">⏸ Stop</button>
</div>

<div id="parts"></div>

<script>
const PARTS=[
{id:"obj-goal",section:"Objectives",label:"Objective — Goal",audio:"audio/obj-goal.mp3",
 en:["Our goal: Help students and teachers sleep well,","so they can live healthy and do well at school and work."]},
{id:"obj1",section:"Objectives",label:"Objective 1",audio:"audio/obj1.mp3",
 en:["One: Know why little sleep hurts you."]},
{id:"obj2",section:"Objectives",label:"Objective 2",audio:"audio/obj2.mp3",
 en:["Two: Make good sleep habits."]},
{id:"obj3",section:"Objectives",label:"Objective 3",audio:"audio/obj3.mp3",
 en:["Three: Find what hurts your sleep,","and learn how to sleep better."]},
{id:"intro",section:"The presentation",label:"Intro",audio:"audio/intro.mp3",
 en:["Good morning, everyone.","Today I want to talk about sleep.","Our project is: “I fell asleep! I didn't understand... I failed!”","Yes — sleep."]},
{id:"v1",section:"The presentation",label:"Verse 1 — Why sleep matters",audio:"audio/v1.mp3",
 en:["Sleep is not only rest.","Sleep is health.","Sleep is learning.","Sleep is well-being.","When we sleep well, we concentrate better.","We remember better. We feel better."]},
{id:"c1",section:"The presentation",label:"Chorus",chorus:true,audio:"audio/chorus.mp3",
 en:["Sleep well...","study better, work better, live better."]},
{id:"v2",section:"The presentation",label:"Verse 2 — What sleep is",audio:"audio/v2.mp3",
 en:["Sleep is the time when our body and mind recover.","For teenagers, we need eight to ten hours of sleep every day."]},
{id:"v3",section:"The presentation",label:"Verse 3 — What affects it",audio:"audio/v3.mp3",
 en:["But many things affect our sleep.","Our phones and computers, with their blue light.","Too much homework and too many classes.","And caffeine and energy drinks."]},
{id:"c2",section:"The presentation",label:"Chorus (again)",chorus:true,audio:"audio/chorus.mp3",
 en:["Sleep well...","study better, work better, live better."]},
{id:"v4",section:"The presentation",label:"Verse 4 — Consequences",audio:"audio/v4.mp3",
 en:["When we do not sleep well, we feel sleepy all day.","Our grades go down.","Our mood changes: we feel irritated, anxious, stressed.","And our body suffers too."]},
{id:"v5",section:"The presentation",label:"Verse 5 — Two visions",audio:"audio/v5.mp3",
 en:["This is not only about students.","Teachers need good sleep too.","When teachers sleep well, they teach better.","When students sleep well, they learn better."]},
{id:"v6",section:"The presentation",label:"Verse 6 — What can we do",audio:"audio/v6.mp3",
 en:["What can we do?","Leave the phone outside the bedroom.","Sleep eight hours every night.","No caffeine at night.","Small habits, big change."]},
{id:"final",section:"Conclusion",label:"Conclusion",chorus:true,audio:"audio/final.mp3",
 en:["So, remember:","Sleep well...","study better, work better, live better.","Thank you."]}
];

const wordsHtml=t=>t.split(/\s+/).map(w=>`<span class="word">${w}</span>`).join(" ");
let html="",curSection="";
PARTS.forEach((p,i)=>{
  if(p.section!==curSection){curSection=p.section;html+=`<h2>${curSection}</h2>`;}
  html+=`<div class="part${p.chorus?' chorus':''}" id="part-${p.id}">
<h3>${p.chorus?'🎵 ':''}${p.label}</h3>
<div class="en">${p.en.map(l=>`<p>${wordsHtml(l)}</p>`).join("")}</div>
<button onclick="playPart(${i})">▶ Listen</button>
<button class="stop" onclick="stopAll()">⏸ Stop</button>
</div>`;
});
document.getElementById('parts').innerHTML=html;

let currentAudio=null, currentWords=[], currentWeights=[], playAllMode=false, playIndex=0, elapsedBase=0;

function fmt(s){s=Math.floor(s);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}
function setElapsed(sec){
  document.getElementById('elapsed').textContent=fmt(sec);
  document.getElementById('progress').style.width=Math.min(100,sec/180*100)+"%";
}
function highlightFor(audio,container){
  const block=container.querySelector('.en');
  const words=block?block.querySelectorAll('.word'):[];
  currentWords=[...words];
  currentWeights=currentWords.map(w=>Math.max(1,w.textContent.length));
  const total=currentWeights.reduce((a,b)=>a+b,0);
  audio.addEventListener('timeupdate',()=>{
    if(!audio.duration) return;
    const prog=audio.currentTime/audio.duration*total; let acc=0, idx=0;
    for(let i=0;i<currentWeights.length;i++){acc+=currentWeights[i]; if(prog>=acc) idx=i+1; else break;}
    currentWords.forEach((w,i)=>w.classList.toggle('on',i<idx));
    setElapsed(playAllMode?elapsedBase+audio.currentTime:audio.currentTime);
  });
  audio.addEventListener('ended',()=>{currentWords.forEach(w=>w.classList.add('on'));});
}
function clearActive(){document.querySelectorAll('.part.active').forEach(e=>e.classList.remove('active'));}
function stopAll(){
  playAllMode=false;
  if(currentAudio){currentAudio.pause();currentAudio=null;}
  document.querySelectorAll('.word.on').forEach(w=>w.classList.remove('on'));
  clearActive();
}
function playPart(i,onEnded){
  stopAll();
  const p=PARTS[i];
  const el=document.getElementById('part-'+p.id);
  el.classList.add('active');
  el.scrollIntoView({block:'center',behavior:'smooth'});
  const a=new Audio(p.audio); currentAudio=a;
  highlightFor(a,el);
  a.addEventListener('ended',()=>{ if(playAllMode) elapsedBase+=a.duration||0; if(onEnded) onEnded(); });
  a.play();
}
function playAll(){
  stopAll();
  playAllMode=true; playIndex=0; elapsedBase=0; setElapsed(0);
  const next=()=>{
    if(playIndex>=PARTS.length){playAllMode=false;return;}
    playPart(playIndex,()=>{ playIndex++; setTimeout(next,1200); });
  };
  next();
}
</script>
</body>
</html>
